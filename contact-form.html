    <nav class="nav-bar">

    <div class="form-container">
        <form class="contact-form" action="https://formspree.io/f/mdekaglq" method="POST">
            <h2>Contact us</h2>
            <label for="name">Name: <input type="text" id="name" name="name" required></label>
            <label for="email">Email: <input type="email" id="email" name="email" required></label>
            <label for="message">Message: <textarea id="message" name="message" rows="3" required></textarea></label>
            <button type="submit">Submit</button>
        </form>
    </div>
