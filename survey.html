<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="description" content="This is the Dover Bay Secondary School Computer Club's survey .">
    <title>DBCC Survey Form</title>
    <link rel="stylesheet" href="survey.css" />
    <link rel="stylesheet" href="default-setting.css" />
    <link rel="icon" type="image/x-icon" href="images/dover-bay-logo-only.png">
  </head>

  <body>
    <header>
      <h1 class="header-title">Dover Bay Computer Club</h1>
    </header>
    <nav class="nav-bar">
      <ul>
        <li><a href="index.html#introduction" class="nav-link">Home</a></li>
        <li><a href="index.html#about" class="nav-link">About Us</a></li>
        <li><a href="contact-form.html" class="nav-link">Contact Us</a></li>
        <li><a href="QA.html" class="nav-link">Q&A</a></li>
        <li><a href="projects-showcase.html" class="nav-link">Projects Showcase</a></li>
      </ul>
    </nav>
    <main>
      <h1 id="title">Coding Club Survey Form</h1>
      <p id="description">We appreciate your opinion on our club :)</p>
      <form class="survey-form" action="https://formspree.io/f/mnpnjdby" method="POST">
      <fieldset class="personal-information section">
        <legend class="legend-title">Personal Information</legend>
        <label id="name-label">
          Name: 
          <input id="name" name="name" type="text" placeholder="e.g. John Doe">
        </label>
        <label id="email-label">
          Email: 
          <input id="email" name="email" type="email" placeholder="example@mail.com">
        </label>
        <label id="number-label">
          Age: 
          <input id="number" name="age" type="number" min="12" max="19" placeholder="e.g. 18">
        </label>
        
        <label id="grade-label">
          Grade: 
          <select required id="dropdown" name="grade">
            <option class="dropdown-option-label" default value="">Please select</option>
            <option class="dropdown-option-label" value="8">8</option>
            <option class="dropdown-option-label" value="9">9</option>
            <option class="dropdown-option-label" value="10">10</option>
            <option class="dropdown-option-label" value="11">11</option>
            <option class="dropdown-option-label" value="12">12</option>
          </select>
        </label>
      </fieldset>
      <fieldset class="satisfaction section">
        <legend class="legend-title">How is the coding club's experience?</legend>
        <label id="very-satisfied-label" class="radio-label">
          <input type="radio" id="very-satisfied_option" class="radio-button" name="experience" value="very-satisfied">
          Very satisfied
        </label>
        <label id="satisfied-label" class="radio-label">
          <input type="radio" id="satisfied_option" class="radio-button" name="experience" value="satisfied">
          Satisfied
        </label>
        <label id="neutral-label" class="radio-label">
          <input type="radio" id="neutral_option" class="radio-button" name="experience" value="neutral">
          Neutral
        </label>
        <label id="poor-label" class="radio-label">
          <input type="radio" id="poor_option" class="radio-button" name="experience" value="poor">
          Poor
        </label>
        <label id="very-poor-label" class="radio-label">
          <input type="radio" id="very-poor-option" class="radio-button" name="experience" value="very-poor">
          Very poor
        </label>
      </fieldset>
      <fieldset class="platform section">
        <legend class="legend-title">Prefered platform</legend>
          <label id="instagram-label" class="checkbox-label">
            <input type="checkbox" id="instagram-option" class="checkbox-button" name="platform" value="instagram">
            Instagram
          </label>
          <label id="x-label" class="checkbox-label">
            <input type="checkbox" id="x-option" class="checkbox-button" name="platform" value="x">
            X
          </label>
          <label id="facebook-label" class="checkbox-label">
            <input type="checkbox" id="facebook-option" class="checkbox-button" name="platform" value="facebook">
            Facebook
          </label>
          <label id="google-classroom-label" class="checkbox-label">
            <input type="checkbox" id="google-classroom-option" class="checkbox-button" name="platform" value="google-classroom">
            Google Classroom
          </label>
          <label id="snapchat-label" class="checkbox-label">
            <input type="checkbox" id="snapchat-option" class="checkbox-button" name="platform" value="snapchat">
            Snapchat
          </label>
      </fieldset>
      <label id="comments-label">
        Any comments or suggestions?
        <textarea id="comments" name="comments"></textarea>
      </label>

      <button type="submit" id="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
